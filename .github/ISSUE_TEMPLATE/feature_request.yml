name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Describe your suggestion and any alternatives you have considered.
