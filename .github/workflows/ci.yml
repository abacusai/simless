name: CI

# Builds and checks; it does not release. Nothing here needs a secret, so a
# pull request from a fork runs the same checks as a push to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the CLI
        run: swift build -c release

      - name: Build SimlessAgent
        run: swiftc -O Agent/main.swift -o "$RUNNER_TEMP/SimlessAgent"

      # The templates are copied into users' iOS apps, whose language mode and
      # default isolation vary. Compile them fully (Swift 6's data-race checks
      # only run past -typecheck) in each configuration they must support.
      - name: Compile the app templates (iOS, every language configuration)
        run: |
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          for mode in \
            "-swift-version 5" \
            "-swift-version 5 -default-isolation MainActor" \
            "-swift-version 6" \
            "-swift-version 6 -default-isolation MainActor -enable-upcoming-feature NonisolatedNonsendingByDefault -enable-upcoming-feature InferIsolatedConformances"
          do
            echo "::group::$mode"
            # shellcheck disable=SC2086
            xcrun swiftc -emit-library -module-name SimlessKitCheck -o "$RUNNER_TEMP/kit.dylib" -D DEBUG $mode \
              -sdk "$sdk" -target arm64-apple-ios17.0 -Xlinker -undefined -Xlinker dynamic_lookup \
              Templates/SimlessKit.swift Templates/SimlessFixtures.swift
            echo "::endgroup::"
          done

      - name: Check benchmark scripts
        run: python3 -m py_compile bench/bench.py bench/memory.py

      - name: CLI smoke test
        run: |
          .build/release/simless --help >/dev/null
          .build/release/simless version
