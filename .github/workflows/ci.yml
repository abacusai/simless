name: CI

# Builds and checks; it does not release. Nothing here needs a secret, so a
# pull request from a fork runs the same checks as a push to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # simless needs Xcode 26+ (Swift 6.2: -default-isolation, defaultIsolation in
      # packages). Runner images default to an older Xcode; select the newest 26.x.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "::error::no Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build the CLI
        run: swift build -c release

      - name: Unit tests (hot reload scoping)
        run: swift test

      - name: Build SimlessAgent
        run: swiftc -O Agent/main.swift -o "$RUNNER_TEMP/SimlessAgent"

      # The templates are copied into users' iOS apps, whose language mode and
      # default isolation vary. Compile them fully (Swift 6's data-race checks
      # only run past -typecheck) in each configuration they must support.
      - name: Compile the app templates (iOS, every language configuration)
        run: |
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          for mode in \
            "-swift-version 5" \
            "-swift-version 5 -default-isolation MainActor" \
            "-swift-version 6" \
            "-swift-version 6 -default-isolation MainActor -enable-upcoming-feature NonisolatedNonsendingByDefault -enable-upcoming-feature InferIsolatedConformances"
          do
            echo "::group::$mode"
            # shellcheck disable=SC2086
            xcrun swiftc -emit-library -module-name SimlessKitCheck -o "$RUNNER_TEMP/kit.dylib" -D DEBUG $mode \
              -sdk "$sdk" -target arm64-apple-ios17.0 -Xlinker -undefined -Xlinker dynamic_lookup \
              Templates/SimlessKit.swift Templates/SimlessFixtures.swift
            echo "::endgroup::"
          done

      - name: Demo app uses the current kit
        run: cmp Templates/SimlessKit.swift Examples/SimlessDemo/SimlessDemo/Simless/SimlessKit.swift

      - name: Build the demo app and its tests (iOS Simulator)
        run: |
          xcodebuild build-for-testing -project Examples/SimlessDemo/SimlessDemo.xcodeproj -scheme SimlessDemo \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/demo" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Check benchmark scripts
        run: python3 -m py_compile bench/bench.py bench/memory.py

      - name: CLI smoke test
        run: |
          .build/release/simless --help >/dev/null
          .build/release/simless version

      # The native mode needs nothing but Xcode: no certificate, profile or Full
      # Disk Access, and a hosted runner is a VM. This runs the demo app end to
      # end the way a user's CI would.
      - name: Demo app end to end (native mode, unsigned)
        timeout-minutes: 20
        working-directory: Examples/SimlessDemo
        run: |
          simless() { "$GITHUB_WORKSPACE/.build/release/simless" "$@"; }
          simless up
          # The app fetches its config at startup: a render host blocks it and says so.
          simless render Welcome | tee welcome.txt
          grep -q "network: blocked 1 request: example.com (/simless-demo/config.json)" welcome.txt && rm welcome.txt
          # Fixtures nobody wrote: the App's root view and a #Preview block.
          simless render all | tee all.txt
          grep -q "^root · " all.txt && grep -q "^LoginView.Error · " all.txt && rm all.txt
          simless render all --matrix
          simless render all --png "$RUNNER_TEMP/renders/"
          # The phone idiom, as an iPhone-only app gets it: a Form in a NavigationStack
          # presented as a sheet took the host down, and a Stepper screen falls back.
          simless render EditProfileView.Sheet --idiom phone | tee sheet.txt
          grep -q "idiom phone" sheet.txt && rm sheet.txt
          simless render all --idiom phone
          # Interaction: a switch flips, a text field takes focus and typing.
          simless act Settings tap "Push notifications" | tee act.txt
          grep -q '"Push notifications" = "0"' act.txt
          simless act Login type "#login.email" "a@b.com" tap "Sign in" | tee act.txt
          grep -q '= "a@b.com" #login.email' act.txt && rm act.txt
          simless test all

      # An edit to one screen, which a shared store names and another screen
      # embeds: the patch holds only that screen for its fixture, says the
      # other fixture is stale, and patches the embedding screen when asked.
      - name: Demo app hot reload (native mode)
        timeout-minutes: 5
        working-directory: Examples/SimlessDemo
        run: |
          simless() { "$GITHUB_WORKSPACE/.build/release/simless" "$@"; }
          sed -i '' 's/Button("Follow")/Button("Follow back")/' SimlessDemo/Screens/ProfileView.swift
          simless reload --dry-run --render Profile | tee scope.txt
          grep -q "would patch 2 file(s)" scope.txt
          simless reload --render Profile --no-fallback | tee reload.txt
          grep -q '"Follow back"' reload.txt
          grep -q "stale until the next full build.*Tabs" reload.txt
          simless reload --render Tabs --no-fallback | tee reload.txt
          grep -q "also patched.*TabsView.swift" reload.txt
          sed -i '' 's/Button("Follow back")/Button("Follow")/' SimlessDemo/Screens/ProfileView.swift
          simless reload | tee reload.txt
          grep -q "were undone" reload.txt
          # A build that fails in between: the host keeps the last one that worked,
          # and the reload after the fix renders the fix and says it's current.
          echo 'let simlessBroken: Int = "x"' >> SimlessDemo/Screens/LoginView.swift
          if simless up --json > up.json; then exit 1; fi
          grep -q '"current" : false' up.json
          sed -i '' '$d' SimlessDemo/Screens/LoginView.swift
          sed -i '' 's/Text("Sign in").font/Text("Sign in again").font/' SimlessDemo/Screens/LoginView.swift
          simless reload --render LoginView.Error | tee reload.txt
          grep -q '"Sign in again"' reload.txt
          simless reload --json --render LoginView.Error > reload.json
          grep -q '"current" : true' reload.json
          sed -i '' 's/Text("Sign in again").font/Text("Sign in").font/' SimlessDemo/Screens/LoginView.swift
          simless reload | tee reload.txt
          grep -q "were undone" reload.txt
          rm scope.txt reload.txt up.json reload.json

      - name: Demo app UI tests (native mode, unsigned)
        timeout-minutes: 10
        working-directory: Examples/SimlessDemo
        env:
          SIMLESS_UI_TRACE: "1"
        run: |
          "$GITHUB_WORKSPACE/.build/release/simless" test ui

      - name: Host logs
        if: failure() || cancelled()
        run: |
          for f in ~/Library/Caches/simless/slots/*/host.log ~/Library/Caches/simless/work/*/build.log \
                   ~/Library/Caches/simless/work/*/ui-artifacts/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"
          done
